name: Deploy eurekaecom.revelio.tech

on:
  push:
    branches: [main]

concurrency:
  group: deploy-revelio-sellerdata-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test frontend
        run: make test

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/known_hosts <<'EOF'
          [186.246.7.44]:2222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIR9D8EC8OI60Xvbx17FPYthuf1hWNA7Z7e2vyemjEOBDt1Hsu6mVdyneWGT6oprPx0iy8SuHwvVAUdpfzPGPOA=
          [186.246.7.44]:2222 ssh-rsa 
          [186.246.7.44]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIrbif3zIqFwSRa6Z3wLmLyiJycc/gyNTBItoPPPQ8+p
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Backup remote web root
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 root@186.246.7.44 \
            'set -eu; mkdir -p /root/revelio-sellerdata-deploy-backups; snapshot="/root/revelio-sellerdata-deploy-backups/$(date +%Y%m%d-%H%M%S)"; cp -a /home/web/revelio-sellerdata "$snapshot"; echo "Snapshot: $snapshot"'

      - name: Deploy static site
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 2222" \
            --exclude-from='.deployignore' \
            ./ root@186.246.7.44:/home/web/revelio-sellerdata/

      - name: Smoke check
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://eurekaecom.revelio.tech/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://eurekaecom.revelio.tech/css/main.css >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://eurekaecom.revelio.tech/js/main.js >/dev/null
